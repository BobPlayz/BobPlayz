name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: BobPlayz
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%239bf6ff&color_dots=%232b2d42%2C%23b8c0ff%2C%239bf6ff%2C%23a0e7e5%2C%23ffc6ff
      - name: Add month labels
        shell: bash
        run: |
          mkdir -p publish
          cp dist/github-contribution-grid-snake.svg publish/github-contribution-grid-snake.svg
          node <<'NODE'
          const fs = require('fs');
          const path = 'publish/github-contribution-grid-snake.svg';
          let svg = fs.readFileSync(path, 'utf8');
          const labels = '<g font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#e8e7ff"><text x="0" y="-12">Aug</text><text x="96" y="-12">Sep</text><text x="192" y="-12">Oct</text><text x="288" y="-12">Nov</text><text x="384" y="-12">Dec</text><text x="480" y="-12">Jan</text><text x="576" y="-12">Feb</text><text x="672" y="-12">Mar</text><text x="768" y="-12">Apr</text><text x="-14" y="14">Mon</text><text x="-14" y="46">Wed</text><text x="-14" y="78">Fri</text></g>';
          svg = svg.replace('</svg>', labels + '</svg>');
          fs.writeFileSync(path, svg);
          NODE
      - name: Publish animation
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: output
          publish_dir: publish
          github_token: ${{ secrets.GITHUB_TOKEN }}
