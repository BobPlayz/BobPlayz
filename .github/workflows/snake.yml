name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: BobPlayz
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300e5ff&color_dots=%23454d56%2C%230e4429%2C%23006d32%2C%2326a641%2C%2339d353
      - name: Add growing snake body, face, and month labels
        shell: bash
        run: |
          mkdir -p publish
          cp dist/github-contribution-grid-snake.svg publish/github-contribution-grid-snake.svg
          node <<'NODE'
          const fs = require('fs');
          const path = 'publish/github-contribution-grid-snake.svg';
          let svg = fs.readFileSync(path, 'utf8');

          const labels = '<g font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#c9d1d9"><text x="0" y="-12">Aug</text><text x="96" y="-12">Sep</text><text x="192" y="-12">Oct</text><text x="288" y="-12">Nov</text><text x="384" y="-12">Dec</text><text x="480" y="-12">Jan</text><text x="576" y="-12">Feb</text><text x="672" y="-12">Mar</text><text x="768" y="-12">Apr</text><text x="-14" y="14">Mon</text><text x="-14" y="46">Wed</text><text x="-14" y="78">Fri</text></g>';
          const face = '<g class="s s0" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="5" r="2.1" fill="#ffffff"/><circle cx="10" cy="5" r="2.1" fill="#ffffff"/><circle cx="4.8" cy="5.2" r="0.9" fill="#06313a"/><circle cx="10.3" cy="5.2" r="0.9" fill="#06313a"/><path d="M4.3 9 Q7.3 12 10.3 9" fill="none" stroke="#06313a" stroke-width="1.2"/></g>'

          // The original animation's .u rectangles are a progress bar, not
          // snake growth. Add 18 trailing segments and reveal them in stages.
          const head = '<rect class="s s0" x="0.8" y="0.8" width="14.4" height="14.4" rx="4.5" ry="4.5"/>';
          const body = [];
          const growthCss = [];
          for (let i = 1; i <= 18; i++) {
            const reveal = Math.min(99, 12 + i * 4.5);
            const delay = -(i * 100);
            body.push('<rect class="s s0 grow' + i + '" x="0.8" y="0.8" width="14.4" height="14.4" rx="4.5" ry="4.5"/>');
            growthCss.push('@keyframes growFade' + i + '{0%,' + reveal + '%{opacity:0}'+ (reveal + 0.1) + '%,100%{opacity:1}} .s.s0.grow' + i + '{animation-name:s0,growFade' + i + ';animation-duration:18500ms,18500ms;animation-timing-function:linear,linear;animation-iteration-count:infinite,infinite;animation-delay:' + delay + 'ms,0ms}');
          }
          svg = svg.replace('</style>', growthCss.join('') + '</style>');
          svg = svg.replace(head, head + body.join(''));
          svg = svg.replace('</svg>', labels + face + '</svg>');
          fs.writeFileSync(path, svg);
          NODE
      - name: Publish animation
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: output
          publish_dir: publish
          github_token: ${{ secrets.GITHUB_TOKEN }}
